<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카테고리 목록 - Category Management</title>
    <style>
        body { font-family: 'Malgun Gothic', Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        h1 { border-bottom: 2px solid #4a90d9; padding-bottom: 10px; color: #2c3e50; }
        .btn { display: inline-block; padding: 8px 16px; background: #4a90d9; color: white; text-decoration: none; border-radius: 4px; margin-bottom: 16px; margin-right: 5px; }
        .btn:hover { background: #357abd; }
        .btn-secondary { background: #6c757d; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #4a90d9; color: white; padding: 12px; text-align: left; }
        td { padding: 10px 12px; border-bottom: 1px solid #ddd; vertical-align: middle; }
        tr:hover { background: #f5f8ff; }
        .btn-delete { background: none; border: none; color: #e74c3c; cursor: pointer; text-decoration: underline; padding: 0; }
        .alert-success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; }
        .alert-danger { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <h1>카테고리 목록</h1>

    <div class="alert-success" th:if="${successMessage}">
        <span th:text="${successMessage}">성공 메시지</span>
    </div>

    <div class="alert-danger" th:if="${errorMessage}">
        <span th:text="${errorMessage}">오류 메시지</span>
    </div>

    <div class="nav-links">
        <a class="btn" th:href="@{/categories/create}">+ 새 카테고리 등록</a>
        <a class="btn btn-secondary" th:href="@{/products}">상품 목록으로 돌아가기</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>카테고리 이름</th>
                <th style="width: 150px">작업</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.id}">1</td>
                <td th:text="${category.name}">카테고리명</td>
                <td>
                    <form th:action="@{/categories/{id}/delete(id=${category.id})}"
                          method="post"
                          onsubmit="return confirm('정말 삭제하시겠습니다? 관련 상품이 있는 카테고리는 삭제할 수 없습니다.');">
                        <button type="submit" class="btn-delete">삭제</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <footer>
        <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 (E) a HH:mm:ss') + ' | 학번: 2271233 | 이름: 임리빈'}"></p>
    </footer>
</body>
</html>
